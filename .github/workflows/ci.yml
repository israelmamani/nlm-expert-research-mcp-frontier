name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:integrity
      - run: npm run scan:secrets
      - name: Validate manifest JSON
        run: node --input-type=module -e "const m=JSON.parse(require('fs').readFileSync('manifest.json')); if(m.manifest_version !== '0.3' || !m.server?.entry_point) process.exit(1)"
